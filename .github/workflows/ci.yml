# CI: checks (the steps below), then promotion: a green push on main fast-forwards the branch `production`,
# which the home server's deployer pulls and applies (the owner's choice of 03/11/2026: a green push goes to production).
# No secret, no connection to the server or the Mac. Agents read the result with `gh run list` and `gh run view`.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:   # a newer push cancels the run of an older one: `production` only moves forward
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # for the promotion only; the checks never use the token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14' # as on the server (Ubuntu 26.04) that runs the bridge

      - name: Install zsh
        run: |
          sudo apt-get install -y -qq zsh > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zsh > /dev/null; }

      - name: List scripts by language
        # Without an extension (ask-haiku, recap...), the shebang decides. Links are skipped.
        run: |
          git ls-files -z | while IFS= read -r -d '' f; do
            [ -f "$f" ] && [ ! -L "$f" ] || continue
            case "${f##*/}" in
              *.py) echo "$f" >> "$RUNNER_TEMP/python.list"; continue ;;
              *.json) echo "$f" >> "$RUNNER_TEMP/json.list"; continue ;;
              *.sh) ;;
              *.*) continue ;;
            esac
            case "$(head -n 1 "$f")" in
              '#!'*zsh*) echo "$f" >> "$RUNNER_TEMP/zsh.list" ;;
              '#!'*bash*|'#!'*/sh|'#!'*/sh' '*) echo "$f" >> "$RUNNER_TEMP/bash.list" ;;
              '#!'*python*) echo "$f" >> "$RUNNER_TEMP/python.list" ;;
            esac
          done
          touch "$RUNNER_TEMP"/{python,json,bash,zsh}.list
          wc -l "$RUNNER_TEMP"/*.list

      - name: Python (py_compile)
        run: |
          status=0
          while IFS= read -r f; do python -m py_compile "$f" || status=1; done < "$RUNNER_TEMP/python.list"
          exit $status

      - name: bash (bash -n, shellcheck -S error)
        run: |
          status=0
          while IFS= read -r f; do bash -n "$f" || status=1; done < "$RUNNER_TEMP/bash.list"
          if [ -s "$RUNNER_TEMP/bash.list" ]; then tr '\n' '\0' < "$RUNNER_TEMP/bash.list" | xargs -0 shellcheck -S error || status=1; fi
          exit $status

      - name: zsh (zsh -n)
        run: |
          status=0
          while IFS= read -r f; do zsh -n "$f" || status=1; done < "$RUNNER_TEMP/zsh.list"
          exit $status

      - name: JSON (json.tool)
        run: |
          status=0
          while IFS= read -r f; do python -m json.tool "$f" > /dev/null || status=1; done < "$RUNNER_TEMP/json.list"
          exit $status

      - name: Offline tests
        # Every tests/test_*.py, run the way its header says: python3 -I <file>.
        # Except tests/test_recap.py: it expects the iCloud download through /usr/bin/brctl,
        # which only macOS has, so it fails on Linux. Run it on the Mac.
        run: |
          status=0; found=0
          while IFS= read -r -d '' f; do
            found=1; echo "== $f"
            python -I "$f" || { echo "::error file=$f::$f failed"; status=1; }
          done < <(git ls-files -z -- 'tests/test_*.py' ':(exclude)tests/test_recap.py')
          [ "$found" = 1 ] || echo "::warning::no offline test found (tests/test_*.py)"
          exit $status

      - name: Promote to production
        # Fast-forward only: GitHub refuses anything else, and the run turns red.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/production" -f sha="$GITHUB_SHA" -F force=false > /dev/null \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/production -f sha="$GITHUB_SHA" > /dev/null
